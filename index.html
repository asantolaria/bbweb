<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#17231b">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Blood Bowl</title>
<style>
:root{
  --bg:#e9ece0; --panel:#fbfcf6; --ink:#17231b; --muted:#5c6a5f; --line:#cdd5c6;
  --grass:#3d7f47; --grass2:#37743f; --ez:#2f6438; --chalk:#f4f5ea; --brass:#d6a640;
  --bad:#b8392c; --good:#2f7d3e; --btn:#e1e6d6;
  --eqA:#b8392c; --eqAt:#ffffff; --eqB:#2b5f9e; --eqBt:#ffffff;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root{ --bg:#0f1811; --panel:#18241b; --ink:#e8ecdd; --muted:#97a596; --line:#2b3a2f; --btn:#24332a; }
}
*,*::before,*::after{box-sizing:inherit}
html{height:100%}
body{height:100%;margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-tap-highlight-color:transparent;overscroll-behavior:none}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:var(--btn);border-radius:10px;padding:.5rem .75rem;touch-action:manipulation}
button:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid var(--brass);outline-offset:2px}
#app{height:100%;display:flex;flex-direction:column;max-width:640px;margin:0 auto}

/* Marcador */
header{flex:none;display:grid;grid-template-columns:1fr auto 1fr;gap:6px;padding:6px 8px;align-items:stretch}
.team{display:flex;align-items:center;gap:8px;padding:4px 8px;border-radius:12px;background:var(--panel);border:1px solid var(--line);min-width:0;text-align:left}
.team.b{flex-direction:row-reverse;text-align:right}
.team.on{border-color:var(--c);box-shadow:inset 0 -3px 0 var(--c)}
.team .sc{font-weight:800;font-size:1.7rem;font-variant-numeric:tabular-nums;line-height:1}
.team .meta{min-width:0;display:flex;flex-direction:column}
.team .nm{font-weight:600;font-size:.82rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.team .sub{font-size:.72rem;color:var(--muted);white-space:nowrap}
.mid{display:flex;flex-direction:column;justify-content:center;align-items:center;background:var(--ink);color:var(--bg);border-radius:12px;padding:4px 10px;min-width:84px;border:0}
.mid small{font-size:.68rem;opacity:.75}
.mid b{font-size:.92rem;line-height:1.1}

/* Campo */
main{flex:1;min-height:0;overflow:auto;display:flex;justify-content:center;align-items:flex-start;padding:2px 0}
.pitch{position:relative;display:grid;grid-template-columns:repeat(15,var(--cell));grid-auto-rows:var(--cell);background:var(--grass);border:3px solid var(--chalk);border-radius:4px;margin:auto}
.c{position:relative;display:grid;place-items:center;box-shadow:inset 0 0 0 .5px rgba(255,255,255,.13)}
.c.s2{background:var(--grass2)}
.c.ez{background:var(--ez)}
.c.wz{box-shadow:inset 0 0 0 .5px rgba(255,255,255,.13), inset 3px 0 0 -1.5px rgba(244,245,234,.35)}
.c.los{border-top:2px solid var(--chalk)}
.c.tz::after{content:"";position:absolute;inset:1px;background:rgba(184,57,44,.28);border-radius:2px;pointer-events:none}
.c.ok::after{content:"";position:absolute;inset:1px;background:rgba(214,166,64,.3);border-radius:2px;pointer-events:none}

.tk{position:relative;width:84%;height:84%;border-radius:50%;background:var(--c);color:var(--t);display:grid;place-items:center;border:2.5px solid var(--anillo,rgba(255,255,255,.92));box-shadow:0 1px 2px rgba(0,0,0,.45);font-weight:800;font-size:calc(var(--cell)*.42);letter-spacing:-.02em;z-index:1}
.tk.big{border-radius:24%;width:96%;height:96%;border-width:2.5px}
.tk span{display:block;transition:transform .15s}
.tk.tumbado{background:rgba(0,0,0,.3);color:#fff;border-width:3px}
.tk.tumbado span{transform:rotate(-90deg)}
.tk.aturdido{background:repeating-linear-gradient(45deg,var(--c) 0 3px,rgba(0,0,0,.55) 3px 6px);color:#fff;border-style:dashed}
.tk.aturdido span{transform:rotate(180deg)}
.tk.distraido{opacity:.75;border-style:dotted}
.tk.act{opacity:.45;filter:grayscale(.85)}
.tk.sel{outline:3px solid var(--brass);outline-offset:1px;opacity:1}
.bc{position:absolute;top:-5px;right:-5px;width:60%;height:60%;filter:drop-shadow(0 1px 1px rgba(0,0,0,.5))}
.c .ball{width:78%;height:78%;filter:drop-shadow(0 1px 2px rgba(0,0,0,.5))}
.bc svg,.ball svg{width:100%;height:100%;display:block}

/* Ficha del jugador en el panel */
.carta{display:flex;gap:10px;align-items:flex-start}
.carta .mini{flex:none;width:34px;height:34px;display:grid;place-items:center}
.carta .mini .tk{width:100%;height:100%;font-size:.95rem}
.carta .datos{min-width:0;flex:1;line-height:1.3}
.carta .nom{font-weight:700}
.carta .est{font-size:.76rem;font-weight:600}
.carta .est.mal{color:var(--bad)}
.carta .est.bien{color:var(--good)}

/* Panel inferior */
footer{flex:none;background:var(--panel);border-top:1px solid var(--line)}
.panel{min-height:96px;padding:8px 10px 2px;display:flex;flex-direction:column;gap:6px}
.info{font-size:.88rem;line-height:1.25;min-height:34px}
.info b{font-weight:650}
.info .skills{display:block;font-size:.74rem;color:var(--muted)}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:8px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chips button{flex:none;padding:.42rem .7rem;font-size:.85rem;font-weight:600;border-radius:999px}
.chips button.hot{background:var(--brass);color:#1a1a1a}
.chips button.warn{background:var(--bad);color:#fff}
nav{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;padding:2px 6px 6px}
nav button{padding:.45rem .2rem;font-size:.78rem;font-weight:600;background:transparent;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
nav button:disabled{opacity:.35}

/* Banquillo */
.bench{display:flex;gap:6px;overflow-x:auto;padding:4px 2px}
.bench button{flex:none;width:44px;height:52px;display:flex;flex-direction:column;align-items:center;gap:2px;padding:4px 2px;font-size:.62rem}
.bench .tk{width:30px;height:30px;font-size:.8rem}
.bench button.sel{outline:2px solid var(--brass)}

/* Hojas */
.wrap{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:flex-end;justify-content:center;z-index:20}
.wrap[hidden]{display:none}
.wrap.center{align-items:center;padding:18px}
.wrap.center .sheet{border-radius:18px;max-width:420px}
.equ-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin:4px 0}
.equ-grid button{padding:.6rem .25rem;font-size:.78rem;border:2px solid var(--line);background:var(--bg);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.equ-grid button.sel{border-color:var(--brass);background:var(--panel);font-weight:800}
.turnode{text-align:center;padding:6px 0 2px}
.turnode .eq{display:inline-block;padding:.4rem 1.2rem;border-radius:999px;color:#fff;font-weight:800;font-size:1.2rem;max-width:100%;overflow:hidden;text-overflow:ellipsis}
.turnode p{margin:.6rem 0 0;font-size:.92rem}
.dato{display:flex;justify-content:space-between;gap:10px;padding:7px 0;border-bottom:1px solid var(--line);font-size:.9rem}
.dato b{text-align:right}
.dato small{display:block;color:var(--muted);font-weight:400}
.sheet{background:var(--panel);width:100%;max-width:640px;max-height:86%;overflow-y:auto;border-radius:18px 18px 0 0;padding:14px 14px calc(18px + env(safe-area-inset-bottom,0px))}
.sheet h2{font-weight:800;font-size:1.35rem;margin:0 0 8px}
.sheet h3{font-weight:700;font-size:.95rem;margin:16px 0 6px;color:var(--muted)}
.shead{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:8px}
.x{background:transparent;color:var(--muted);padding:.3rem .55rem;font-size:1rem}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:6px 0}
.field{flex:1;min-width:0;padding:.55rem .7rem;border-radius:10px;border:1px solid var(--line);background:var(--bg)}
.primary{background:var(--ink);color:var(--bg);font-weight:600;width:100%;padding:.7rem}
.log{font-size:.8rem;line-height:1.45;white-space:pre-wrap;color:var(--muted);max-height:50vh;overflow:auto;background:var(--bg);border-radius:10px;padding:8px 10px}
.toast{position:fixed;left:50%;bottom:120px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:.5rem .9rem;border-radius:10px;font-size:.85rem;opacity:0;transition:opacity .2s;z-index:40;max-width:90%;pointer-events:none}
.toast.show{opacity:1}
</style>
</head>
<body>
<div id="app">
  <header id="top"></header>
  <main><div id="pitch" class="pitch"></div></main>
  <footer>
    <div class="panel">
      <div class="info" id="info"></div>
      <div class="chips" id="chips"></div>
    </div>
    <nav id="nav"></nav>
  </footer>
</div>
<div class="wrap" id="wrap" hidden><div class="sheet" id="sheet"></div></div>
<div class="toast" id="toast"></div>
<script type="module" src="./src/ui/app.js"></script>
<script>
// La app se instala como PWA: icono en la pantalla de inicio, pantalla completa y
// funcionar sin conexión. Si el service worker falla (http sin localhost), no pasa nada.
if ('serviceWorker' in navigator) {
  addEventListener('load', () => navigator.serviceWorker.register('./sw.js').catch(() => {}));
}
</script>
</body>
</html>
